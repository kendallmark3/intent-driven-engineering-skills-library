<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff}
  .c{width:800px;height:1100px;box-sizing:border-box;padding:96px 88px 80px;
     font-family:"Inter",sans-serif;color:#1d1d1f;display:flex;flex-direction:column;
     border:1px solid #e5e5ea;position:relative;background:#fff}
  .eyebrow{font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#86868b;font-weight:500}
  h1{font-family:"Inter Display","Inter",sans-serif;font-weight:700;font-size:82px;line-height:1.0;
     letter-spacing:-.035em;margin:22px 0 0}
  .rule{width:56px;height:3px;background:#0071e3;margin:40px 0 34px;border-radius:2px}
  .sub{font-size:26px;line-height:1.38;color:#3a3a3c;font-weight:400;letter-spacing:-.01em;max-width:500px}
  .tag{margin-top:22px;font-size:17px;color:#86868b;font-weight:500;letter-spacing:.01em}
  .mark{flex:1;display:flex;align-items:center;justify-content:center}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #e5e5ea;padding-top:26px}
  .name{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .role{font-size:14px;color:#86868b;margin-top:4px}
  .site{font-size:14px;color:#86868b;text-align:right;line-height:1.6}
</style></head>
<body><div class="c">
  <div class="eyebrow">Intent-Driven Engineering</div>
  <h1>Skills<br>Library</h1>
  <div class="rule"></div>
  <div class="sub">Reusable agent skills for real-world AI engineering.</div>
  <div class="tag">Build faster. Stay focused. Deliver proof.</div>
  <div class="mark">
    <svg width="300" height="300" viewBox="0 0 300 300" fill="none">
      <!-- progressive intent loop: intent → build → evidence → check -->
      <circle cx="150" cy="150" r="104" stroke="#e5e5ea" stroke-width="2"/>
      <path d="M150 46 A104 104 0 0 1 254 150" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M254 150 A104 104 0 0 1 150 254" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M150 254 A104 104 0 0 1 46 150" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M46 150 A104 104 0 0 1 150 46" stroke="#0071e3" stroke-width="3" stroke-linecap="round"/>
      <circle cx="150" cy="46" r="9" fill="#0071e3"/>
      <circle cx="254" cy="150" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="2.5"/>
      <circle cx="150" cy="254" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="2.5"/>
      <circle cx="46" cy="150" r="7" fill="#fff" stroke="#1d1d1f" stroke-width="2.5"/>
      <circle cx="150" cy="150" r="5" fill="#1d1d1f"/>
      <text x="150" y="24" text-anchor="middle" font-family="Inter" font-size="12" letter-spacing="2" fill="#0071e3" font-weight="600">INTENT</text>
      <text x="276" y="154" text-anchor="start" font-family="Inter" font-size="12" letter-spacing="2" fill="#86868b" font-weight="500" transform="rotate(90 276 150)">BUILD</text>
      <text x="150" y="286" text-anchor="middle" font-family="Inter" font-size="12" letter-spacing="2" fill="#86868b" font-weight="500">EVIDENCE</text>
      <text x="24" y="154" text-anchor="middle" font-family="Inter" font-size="12" letter-spacing="2" fill="#86868b" font-weight="500" transform="rotate(-90 24 150)">CHECK</text>
    </svg>
  </div>
  <div class="foot">
    <div><div class="name">Mark Kendall</div><div class="role">Founder, Intent-Driven Engineering</div></div>
    <div class="site">LearnTeachMaster.org<br>intent-driven-engineering.com</div>
  </div>
</div></body></html>
